# Custom CWE-306 rule — no stock SemGrep rule covers "Flask route handler for a
# STATE-CHANGING method with no auth decorator". Written WITH device-service/app.py:
#   - FIRES on the vulnerable `@app.post("/device/command")` handler (no auth
#     decorator directly above `def`).
#   - SILENT on the patched handler (same route, but guarded by @require_token).
#   - SILENT on read-only `@app.get(...)` endpoints (/device/status, /device/_truth):
#     a status read is not a "critical function", so flagging it would be noise.
#
# Scope to mutating verbs (post/put/patch/delete) only. The handlers use Flask's
# @app.post / @app.get shortcuts, so $METHOD is the verb itself — that is what
# lets this rule fire on the POST command but stay silent on the GET status read.
#
# Validate + test:
#   semgrep scan --config device-service/rules --validate
#   semgrep --test --config device-service/rules/missing-auth.yaml \
#       security/tests/semgrep_fixtures/missing-auth.py
# Run (pipeline):
#   semgrep scan --config device-service/rules --json --metrics off \
#       --disable-version-check --quiet device-service > semgrep.json

rules:
  - id: flask-missing-auth-decorator
    languages: [python]
    severity: ERROR
    message: >-
      State-changing Flask route handler is registered with no
      authentication/authorization guard (e.g. @login_required, a custom
      @require_token / @require_auth(...), or a FastAPI Depends(...) auth
      dependency). An unauthenticated caller can invoke this handler directly.
      CWE-306: Missing Authentication for Critical Function.
    metadata:
      cwe: CWE-306
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/306.html
      category: security
      confidence: HIGH
      technology:
        - flask
        - fastapi
      author: "Dev 2 (security-verification) — PreVent, Cal Hacks 13.0"
    patterns:
      # A route handler whose decorator sits directly above `def`.
      - pattern: |
          @$APP.$METHOD(...)
          def $FUNC(...):
              ...
      # Only state-changing verbs — read-only @app.get(...) is out of scope.
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(post|put|patch|delete)$
      # --- authenticated handlers are NOT findings -------------------------
      # Flask-Login style bare decorator.
      - pattern-not: |
          @$APP.$METHOD(...)
          @login_required
          def $FUNC(...):
              ...
      # This project's custom bare auth decorator.
      - pattern-not: |
          @$APP.$METHOD(...)
          @require_token
          def $FUNC(...):
              ...
      # Any call-form auth decorator, e.g. @require_auth(...), @roles_required(...).
      - pattern-not: |
          @$APP.$METHOD(...)
          @$AUTH(...)
          def $FUNC(...):
              ...
      # FastAPI-style dependency-injected auth (Depends(...) as a param default).
      - pattern-not: |
          @$APP.$METHOD(...)
          def $FUNC(..., $PARAM = Depends(...), ...):
              ...
